name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Decide se integration-tests precisa rodar: subir Postgres custa ~30s e não
  # tem por que pagar esse custo em todo PR que só mexe no frontend.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      fullstack: ${{ steps.filter.outputs.fullstack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'prisma/**'
            fullstack:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'prisma/**'

  # Bloqueante: erros de tipo nunca devem entrar. Hoje 100% verde.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run shared:check
      - run: npx prisma validate

  # Informativo por enquanto: apps/web tem 16 erros de ESLint pré-existentes
  # (react-hooks/set-state-in-effect em use-socket.ts e outros hooks) que não
  # fazem parte deste trabalho de CI/testes. Promova para required check depois
  # de zerar esse débito — ver docs/doc_desenvolvimento/testes-e-ci.md.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Só roda se o PR tocar código de banco/API — path-filtered (ver detect-changes).
  # Nunca herda DATABASE_URL/REDIS_URL do ambiente: usa só o Postgres efêmero
  # deste job, nunca os secrets de produção.
  integration-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d xua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/xua_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Também funciona como validação de que a cadeia de migrations aplica
      # limpa do zero — não é feito no deploy real (Render roda contra o banco
      # de produção, que já está migrado).
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:web

  # Scaffold de fase 2 do E2E — informativo, não bloqueia merge (continue-on-error).
  # Sobe o stack inteiro (Postgres + Redis efêmeros, seed, API, web build) só
  # com segredos fabricados para este job, nunca herdando .env de produção.
  # Promova para required check só depois de mais fluxos cobertos além do smoke.
  e2e-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.fullstack == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d xua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/xua_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use
      INTERNAL_SECRET: e2e-ci-internal-secret-not-for-production
      OTP_SECRET: e2e-ci-otp-secret
      DUMMY_HASH: "$2b$10$wXg1jNr2OCG.oa4U0Z3YXukHuIW/LnpTfPgFQVsudRT/Ddagqx0JW"
      APP_ORIGIN: http://localhost:3001
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API (background)
        run: npx tsx apps/api/src/server/index.ts &
        env:
          PORT: "4000"
      - run: npm run build:web
      - name: Start web (background)
        run: npx next start --port 3001 &
        working-directory: apps/web
      - name: Wait for API and web
        run: |
          for url in http://localhost:4000/health http://localhost:3001/login; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 2
            done
            [ "$code" = "200" ] || { echo "Timed out waiting for $url"; exit 1; }
          done
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
