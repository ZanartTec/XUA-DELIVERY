services:
  # ─── Redis (Key Value Service) ───────────────────────────────────────────
  - type: redis
    name: xua-redis
    plan: free
    ipAllowList: []

  # ─── API (HTTP Server) ────────────────────────────────────────────────────
  - type: web
    name: xua-api
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npx tsx apps/api/src/server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info

      # ─── Banco de Dados ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ─── Redis (BullMQ + Cache) ───────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: xua-redis
          property: connectionString

      # ─── Segurança ────────────────────────────────────────────────────────
      - key: DUMMY_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false

      # ─── Criptografia de segredos em repouso ────────────────────────────
      - key: ENCRYPTION_MASTER_KEY
        sync: false

      # ─── CORS ─────────────────────────────────────────────────────────────
      - key: APP_ORIGIN
        sync: false

      # ─── Pagamentos (Mercado Pago) ─────────────────────────────────────────
      - key: PAYMENT_PROVIDER
        value: mercadopago
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

      - key: MERCADOPAGO_BACK_URL_SUCCESS
        sync: false
      - key: MERCADOPAGO_BACK_URL_FAILURE
        sync: false
      - key: MERCADOPAGO_BACK_URL_PENDING
        sync: false
      - key: MERCADOPAGO_STATEMENT_DESCRIPTOR
        value: XUA DELIVERY
      - key: MERCADOPAGO_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS
        value: "600"
      - key: MERCADOPAGO_NOTIFICATION_SOURCE
        value: webhooks

      # ─── Rate Limits de Pagamento ──────────────────────────────────────────
      - key: PAYMENT_CHARGE_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_CHARGE_RATE_LIMIT_MAX
        value: "12"
      - key: PAYMENT_STATUS_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_STATUS_RATE_LIMIT_MAX
        value: "120"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_MAX
        value: "600"

      # ─── Expiração automática de pagamentos ────────────────────────────────
      # Tempo em minutos antes de um pedido pendente ser cancelado (padrão: 15)
      - key: PAYMENT_EXPIRATION_MINUTES
        value: "15"

      # ─── Push Notifications (VAPID) ────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ─── Worker (Background Jobs) ─────────────────────────────────────────────
  - type: worker
    name: xua-worker
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx tsx apps/api/src/worker/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # ─── Banco de Dados ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ─── Redis ───────────────────────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: xua-redis
          property: connectionString

      # ─── Segurança ────────────────────────────────────────────────────────
      # O worker precisa do JWT_SECRET para emitir eventos autenticados via Socket.IO
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false

      # ─── Criptografia de segredos em repouso ────────────────────────────
      # Precisa ser IDÊNTICA à do xua-api (cifra lá, decifra aqui) — herdada
      # automaticamente em vez de exigir entrada manual duplicada no dashboard.
      - key: ENCRYPTION_MASTER_KEY
        fromService:
          name: xua-api
          type: web
          envVarKey: ENCRYPTION_MASTER_KEY

      # ─── Pagamentos ───────────────────────────────────────────────────────
      - key: PAYMENT_PROVIDER
        value: mercadopago
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false

      # ─── Expiração automática de pagamentos ────────────────────────────────
      - key: PAYMENT_EXPIRATION_MINUTES
        value: "15"

      # ─── Concorrência dos workers ─────────────────────────────────────────
      - key: INTERNAL_JOBS_WORKER_CONCURRENCY
        value: "1"
      - key: PAYMENT_WEBHOOK_WORKER_CONCURRENCY
        value: "2"
      - key: PAYMENTS_WORKER_CONCURRENCY
        value: "2"
      - key: SUBSCRIPTION_EXPIRATION_WORKER_CONCURRENCY
        value: "2"

      # ─── App (para Socket.IO e notificações) ──────────────────────────────
      - key: APP_ORIGIN
        sync: false

      # ─── Push Notifications (VAPID) ────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ─── Web (Frontend Next.js) ───────────────────────────────────────────────
  - type: web
    name: xua-web
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @xua/web
    startCommand: npm run start -w @xua/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_URL
        value: http://xua-api:3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          name: xua-api
          type: web
          envVarKey: JWT_SECRET
      - key: INTERNAL_SECRET
        fromService:
          name: xua-api
          type: web
          envVarKey: INTERNAL_SECRET
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        fromService:
          name: xua-api
          type: web
          envVarKey: VAPID_PUBLIC_KEY
