services:
  # ─── Redis CACHE (Key Value Service) ──────────────────────────────────────
  # Finalidade: cache best-effort (produtos, banners), rate limiting,
  # blacklist de JWT, tokens de reset de senha, exibição de OTP.
  # Todas as chaves têm TTL ⇒ volatile-lru evicta com segurança sob pressão.
  # Perda de dados é tolerável: a API degrada (readiness "degraded"), não cai.
  - type: redis
    name: xua-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: volatile-lru

  # ─── Redis QUEUE (Key Value Service — BullMQ) ─────────────────────────────
  # Finalidade EXCLUSIVA: filas BullMQ (internal-jobs, payment-webhooks,
  # payments, payment-refunds, subscription-expiration).
  # NUNCA plan free: fila exige persistência e noeviction — eviction de
  # chaves BullMQ corrompe estado de jobs (delayed/waiting) silenciosamente.
  # Se a versão do blueprint não aceitar maxmemoryPolicy, configure
  # "noeviction" manualmente no dashboard do Render antes do primeiro deploy.
  - type: redis
    name: xua-queue-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ─── API (HTTP Server) ────────────────────────────────────────────────────
  - type: web
    name: xua-api
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npx tsx apps/api/src/server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info

      # ─── Banco de Dados ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ─── Redis (separação cache × fila) ───────────────────────────────────
      # REDIS_URL permanece como FALLBACK de migração: o código resolve
      # CACHE_REDIS_URL/QUEUE_REDIS_URL e cai para REDIS_URL se ausentes.
      # Remover REDIS_URL somente em release futura, após validar em produção
      # que os logs de boot mostram fallback=false para cache e queue.
      - key: REDIS_URL
        fromService:
          type: redis
          name: xua-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: redis
          name: xua-redis
          property: connectionString
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: xua-queue-redis
          property: connectionString

      # ─── Segurança ────────────────────────────────────────────────────────
      - key: DUMMY_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      # Segredo HMAC dos tokens de redefinição de senha ("esqueci a senha")
      - key: PASSWORD_RESET_SECRET
        sync: false

      # ─── Criptografia de segredos em repouso ────────────────────────────
      - key: ENCRYPTION_MASTER_KEY
        sync: false

      # ─── CORS ─────────────────────────────────────────────────────────────
      - key: APP_ORIGIN
        sync: false

      # ─── E-mail (Resend) — redefinição de senha ────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      # Remetente. Requer domínio verificado no Resend p/ enviar a qualquer e-mail.
      - key: MAIL_FROM
        sync: false

      # ─── Pagamentos (Mercado Pago) ─────────────────────────────────────────
      - key: PAYMENT_PROVIDER
        value: mercadopago
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

      - key: MERCADOPAGO_BACK_URL_SUCCESS
        sync: false
      - key: MERCADOPAGO_BACK_URL_FAILURE
        sync: false
      - key: MERCADOPAGO_BACK_URL_PENDING
        sync: false
      - key: MERCADOPAGO_STATEMENT_DESCRIPTOR
        value: XUA DELIVERY
      - key: MERCADOPAGO_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS
        value: "600"
      - key: MERCADOPAGO_NOTIFICATION_SOURCE
        value: webhooks

      # ─── Rate Limits de Pagamento ──────────────────────────────────────────
      - key: PAYMENT_CHARGE_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_CHARGE_RATE_LIMIT_MAX
        value: "12"
      - key: PAYMENT_STATUS_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_STATUS_RATE_LIMIT_MAX
        value: "120"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_MAX
        value: "600"

      # ─── Expiração automática de pagamentos ────────────────────────────────
      # Tempo em minutos antes de um pedido pendente ser cancelado (padrão: 15)
      - key: PAYMENT_EXPIRATION_MINUTES
        value: "15"

      # ─── Push Notifications (VAPID) ────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ─── Worker (Background Jobs) ─────────────────────────────────────────────
  - type: worker
    name: xua-worker
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx tsx apps/api/src/worker/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # ─── Banco de Dados ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ─── Redis (fila BullMQ) ──────────────────────────────────────────────
      # O worker só consome filas (Fase 2 removeu uso de cache no worker) —
      # não precisa de CACHE_REDIS_URL. REDIS_URL segue como fallback de
      # migração; remover em release futura junto com o da xua-api.
      - key: REDIS_URL
        fromService:
          type: redis
          name: xua-redis
          property: connectionString
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: xua-queue-redis
          property: connectionString

      # ─── Segurança ────────────────────────────────────────────────────────
      # O worker precisa do JWT_SECRET para emitir eventos autenticados via Socket.IO
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false

      # ─── Criptografia de segredos em repouso ────────────────────────────
      # Precisa ser IDÊNTICA à do xua-api (cifra lá, decifra aqui) — herdada
      # automaticamente em vez de exigir entrada manual duplicada no dashboard.
      - key: ENCRYPTION_MASTER_KEY
        fromService:
          name: xua-api
          type: web
          envVarKey: ENCRYPTION_MASTER_KEY

      # ─── Pagamentos ───────────────────────────────────────────────────────
      - key: PAYMENT_PROVIDER
        value: mercadopago
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false

      # ─── Expiração automática de pagamentos ────────────────────────────────
      - key: PAYMENT_EXPIRATION_MINUTES
        value: "15"

      # ─── Concorrência dos workers ─────────────────────────────────────────
      - key: INTERNAL_JOBS_WORKER_CONCURRENCY
        value: "1"
      - key: PAYMENT_WEBHOOK_WORKER_CONCURRENCY
        value: "2"
      - key: PAYMENTS_WORKER_CONCURRENCY
        value: "2"
      - key: SUBSCRIPTION_EXPIRATION_WORKER_CONCURRENCY
        value: "2"

      # ─── App (para Socket.IO e notificações) ──────────────────────────────
      - key: APP_ORIGIN
        sync: false

      # ─── Push Notifications (VAPID) ────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ─── Web (Frontend Next.js) ───────────────────────────────────────────────
  - type: web
    name: xua-web
    rootDir: xua-delivery
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @xua/web
    startCommand: npm run start -w @xua/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_URL
        value: http://xua-api:3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          name: xua-api
          type: web
          envVarKey: JWT_SECRET
      - key: INTERNAL_SECRET
        fromService:
          name: xua-api
          type: web
          envVarKey: INTERNAL_SECRET
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        fromService:
          name: xua-api
          type: web
          envVarKey: VAPID_PUBLIC_KEY
